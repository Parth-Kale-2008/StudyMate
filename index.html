<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chatbot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#212121;
            color:white;
            height:100vh;
            overflow:hidden;
            font-family:Segoe UI, sans-serif;
        }

        .app{
            display:flex;
            height:100vh;
        }
        

        /* Sidebar */

        .sidebar{
            width:280px;
            background:#171717;
            border-right:1px solid #2d2d2d;
            padding:15px;
        }

        .new-chat{
            width:100%;
            border:none;
            background:#2f2f2f;
            color:white;
            padding:12px;
            border-radius:10px;
            margin-bottom:20px;
        }

        .chat-item{
            padding:12px;
            border-radius:10px;
            cursor:pointer;
            margin-bottom:5px;
            transition:0.3s;
        }

        .chat-item:hover{
            background:#2a2a2a;
        }

        /* Main Chat */

        .main-chat{
            flex:1;
            display:flex;
            flex-direction:column;
        }

        .messages{
            flex:1;
            overflow-y:auto;
            padding:30px;
        }

        .message-container{
            max-width:850px;
            margin:auto;
        }

        .user-message{
            background:#303030;
            padding:12px 18px;
            border-radius:12px;
            width:fit-content;
            margin-left:auto;
            margin-bottom:20px;
        }

        .bot-message{
            margin-bottom:25px;
            line-height:1.7;
        }

        /* Input */

        .input-section{
            padding:20px;
            border-top:1px solid #333;
        }

        .input-wrapper{
            max-width:900px;
            margin:auto;
            background:#2f2f2f;
            border-radius:18px;
            display:flex;
            align-items:center;
            padding:10px;
        }

        textarea{
            flex:1;
            background:transparent;
            border:none;
            outline:none;
            color:white;
            resize:none;
            padding:10px;
            font-size:16px;
        }

        .send-btn{
            width:50px;
            height:50px;
            border:none;
            border-radius:50%;
            background:white;
            color:black;
            font-size:18px;
        }

        .welcome{
            text-align:center;
            margin-top:120px;
        }

        .welcome h1{
            font-size:40px;
            margin-bottom:10px;
        }

        .welcome p{
            color:#a0a0a0;
        }
    </style>
</head>
<body>

<div class="app">

    <!-- Sidebar -->

    <div class="sidebar">

        <button class="new-chat">
            <i class="bi bi-plus-lg"></i>
            New Chat
        </button>

        <div class="chat-item">
            Explain RAG
        </div>

        <div class="chat-item">
            Unit 1 Questions
        </div>

        <div class="chat-item">
            Security Notes
        </div>

    </div>

    <!-- Main Area -->

    <div class="main-chat">

        <div class="messages">

            <div class="message-container">

                <div class="welcome">
                    <h1>RAG Assistant</h1>
                    <p>Ask questions from your uploaded PDFs</p>
                </div>

                <!-- Example Messages -->

                <!--
                <div class="user-message">
                    What is RAG?
                </div>

                <div class="bot-message">
                    RAG stands for Retrieval Augmented Generation...
                </div>
                -->

            </div>

        </div>

        <!-- Input -->

        <div class="input-section">

            <div class="input-wrapper">

                <textarea
                    rows="1"
                    placeholder="Message your RAG assistant..."></textarea>

                <button class="send-btn">
                    <i class="bi bi-send-fill"></i>
                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
